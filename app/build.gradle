plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt.gradle)
    alias(libs.plugins.ksp)
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.kotlin.serialization)
}

android {
    ndkVersion "29.0.14206865"
    compileSdk 37

    defaultConfig {
        applicationId "in.kawaiis.journal"
        minSdk 26
        targetSdk 37
        versionCode 907000

        versionName "9.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def b64 = System.getenv("KEYSTORE_BASE64")
            if (b64 != null && !b64.isBlank()) {
                b64 = b64.trim().replaceAll("\\s", "")
                def keystoreFile = file("${project.buildDir}/release.keystore.jks")
                keystoreFile.parentFile.mkdirs()
                keystoreFile.bytes = java.util.Base64.getDecoder().decode(b64)
                storeFile = keystoreFile
                storePassword = System.getenv("KEYSTORE_PASSWORD")
                keyAlias = System.getenv("KEY_ALIAS")
                keyPassword = System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            def b64 = System.getenv("KEYSTORE_BASE64")
            if (b64 != null && !b64.isBlank()) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = null
            }
            
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            vcsInfo {
                // F-Droid reproducible builds: the embedded VCS info differs between
                // build environments, breaking byte-identical verification.
                include = false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig = false
    }

    packagingOptions {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }

    splits {
        abi {
            enable false
            reset()  
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64" 
            universalApk true
        }
    }

    dependenciesInfo {
        includeInApk = false
    }
    
    namespace "com.isaakhanimann.journal"
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

